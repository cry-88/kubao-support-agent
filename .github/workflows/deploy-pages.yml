name: Deploy to GitHub Pages

# 推送到 main 或手动触发：语法检查 → 单元/集成测试 → 敏感信息扫描 → 构建静态站点 → 发布 Pages
#
# 站点地址不变： https://cry-88.github.io/kubao-support-agent/
# 首次使用需在 Settings → Pages → Source 选择「GitHub Actions」。
#
# 说明（阶段7）：
#   Pages 上只有前端页面，构建时把 assets/runtime.js 改写成 __CS_MODE__='static'，
#   页面进入静态预览模式：不发任何后端请求，只做界面演示。
#   完整功能（对话、工单、看板真实数据）需访问服务器部署版本。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 全量语法检查（后端 + 前端）
        run: |
          set -e
          for f in server.js server/*.js server/analytics/*.js assets/*.js; do
            node --check "$f"
            echo "✔ $f"
          done

      - name: 入口文件完整性
        run: |
          set -e
          for f in index.html admin.html 404.html \
                   assets/runtime.js assets/config.js assets/app.js assets/kb.js \
                   assets/admin.js assets/dashboard.js schema.sql; do
            test -f "$f" || { echo "::error::缺少 $f"; exit 1; }
            echo "✔ $f"
          done

      - name: 单元与集成测试
        run: npm test

      - name: 敏感信息扫描
        run: |
          set -e
          PATTERN='(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY)'
          # 排除本文件自身与构建产物
          if grep -rInE "$PATTERN" \
               --include='*.js' --include='*.html' --include='*.md' --include='*.sql' --include='*.yml' --include='*.sh' \
               --exclude='deploy-pages.yml' \
               --exclude-dir='dist' --exclude-dir='dist-pages' --exclude-dir='node_modules' . ; then
            echo "::error::检测到疑似密钥或私钥，已阻止部署"
            exit 1
          fi
          echo "✔ 未发现常见密钥特征"

      - name: 数据库脚本结构检查
        run: |
          set -e
          FUNCS=$(grep -c '^CREATE OR REPLACE FUNCTION' schema.sql)
          TABLES=$(grep -c '^CREATE TABLE' schema.sql)
          echo "函数: $FUNCS / 表: $TABLES"
          test "$FUNCS" -ge 28 || { echo "::error::函数数量异常"; exit 1; }
          test "$TABLES" -ge 7 || { echo "::error::表数量异常"; exit 1; }

  deploy:
    name: 构建并发布
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 只发布构建产物：后端代码、部署脚本、数据目录都不会进入站点
      - name: 构建静态站点（dist-pages）
        run: bash scripts/build-pages.sh

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
