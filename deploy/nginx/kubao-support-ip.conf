# =============================================================================
# 哭包智能客服 · Nginx 反向代理（裸 IP，无域名 / 无 HTTPS）
#
# 适用：内网测试、临时演示、还没有域名和证书的阶段。
# 注意：没有 TLS，管理员口令与坐席口令会以明文经过网络。
#       仅限内网或临时使用；对外请尽快换成 kubao-support.conf（域名 + HTTPS）。
#
# 安装位置：/etc/nginx/conf.d/kubao-support-ip.conf
# =============================================================================

upstream kubao_support_ip {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 换成服务器公网 IP 或不写（作为默认站点）
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    # 没有 HTTPS 就不要发 HSTS，否则未来上证书时会被浏览器强制 https
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;

    location = /health {
        access_log off;
        proxy_pass http://kubao_support_ip;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://kubao_support_ip;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    300s;

        # SSE 必需
        proxy_buffering off;
        proxy_cache off;
    }
}
