# =============================================================================
# 哭包智能客服 · Nginx 反向代理（域名 + HTTPS）
#
# 安装位置：/etc/nginx/conf.d/kubao-support.conf
# 使用前把 support.example.com 换成你的域名，并先跑过 certbot 拿到证书。
#
# 要点：
#   1. 反代到 127.0.0.1:8080（Node 只监听环回，不直接对外）
#   2. SSE 必须 proxy_buffering off，否则流式回答会"憋"到结束才吐
#   3. X-Forwarded-For 用 $proxy_add_x_forwarded_for：在客户端伪造值后面追加真实来源，
#      应用侧只采信最后一段（见 server/client-ip.js），伪造无效
#   4. client_max_body_size 与应用侧 CS_BODY_LIMIT_BYTES（1MB）保持一致
# =============================================================================

upstream kubao_support {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------- HTTP：只做跳转与 ACME 校验 ----------
server {
    listen 80;
    listen [::]:80;
    server_name support.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name support.example.com;

    ssl_certificate     /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 确认 HTTPS 稳定后再开 HSTS（开启后浏览器会强制走 https，回退成本高）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    server_tokens off;

    # 健康检查：不记访问日志，避免探针刷日志
    location = /health {
        access_log off;
        proxy_pass http://kubao_support;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://kubao_support;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # 流式回答可能持续较久；应用侧单轮通常在秒级，这里给足余量
        proxy_read_timeout    300s;

        # SSE 必需：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }
}
